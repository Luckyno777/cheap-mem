name: CI

# Runs on every push and pull request. The point is not ceremony: the
# tests only ever ran when a human remembered, and that human was always
# the same person. This is the check that survives them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. Without this, a quick succession of pushes leaves older
# runs burning minutes on commits nobody will look at again, and the run
# that matters queues behind them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not stop the others when one fails. A Windows-only failure is
      # exactly the kind of thing worth seeing alongside a green Linux.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --omit=optional on purpose: better-sqlite3 and sqlite-vec are
      # optional dependencies, and the whole point is that cheap-mem
      # works without them. Installing them here would hide a break in
      # exactly the path most users take.
      - run: npm ci --omit=optional

      # `node --test` with no argument, never `test/*.test.mjs`:
      # PowerShell does not expand globs, so the glob form passes on
      # Linux and fails on Windows for a reason that has nothing to do
      # with the code.
      - run: npm test

  smoke:
    name: smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional

      # Can a stranger actually start? Unit tests answer "do the parts
      # work"; this answers "does the thing run at all", which is the
      # question the first user asks.
      - name: init a fresh memory and check it
        shell: bash
        run: |
          set -euo pipefail
          MEMDIR="$(mktemp -d)"
          node bin/mem --root "$MEMDIR" init
          node bin/mem --root "$MEMDIR" log decision \
            --topic ci --choice "run on three platforms" --why "windows breaks differently"
          node bin/mem --root "$MEMDIR" find "why three platforms"
          node bin/mem --root "$MEMDIR" duties
          # doctor exits 1 on warnings; a fresh memory has some (no git
          # hook, no stop hook), so only a hard failure counts here.
          node bin/mem --root "$MEMDIR" doctor || test $? -ne 2

      # The secret check must actually block a commit — not merely be
      # configured. A hook can be wired up perfectly and never run.
      - name: prove the redaction hook blocks a decoy
        shell: bash
        run: |
          set -euo pipefail
          MEMDIR="$(mktemp -d)"
          cd "$MEMDIR"
          git init -q .
          git config user.email ci@example.test
          git config user.name CI
          node "$GITHUB_WORKSPACE/bin/mem" init
          git add -A && git commit -q -m base --no-verify
          node "$GITHUB_WORKSPACE/bin/mem" hooks install
          printf 'Decoy, not a real secret.\nghp_%s\n' "$(printf 'A%.0s' $(seq 36))" > decoy.txt
          git add decoy.txt
          BEFORE="$(git rev-parse HEAD)"
          if git commit -m "must be blocked"; then
            echo "::error::the pre-commit hook let a planted token through"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$BEFORE"
          echo "hook blocked the decoy, HEAD unchanged"

  retrieve:
    name: recall · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional

      # Lane 3 is the one that turns "can remember" into "remembers".
      # It runs on every message, so the test that matters most measures
      # that it never blocks the prompt — against a git that hangs on
      # pull. The rest guards the throttle, the dirty-tree skip, and the
      # score threshold.
      - name: recall runs on every turn without ever waiting
        shell: bash
        run: bash test/retrieve.sh

      # Lane 1 must be environment-independent: the Stop hook captures
      # model-free AND persists it (push), because nothing else pushes
      # captures. Without this an ephemeral environment loses the capture.
      - name: the Stop hook persists the capture (push)
        shell: bash
        run: bash test/stop-persists.sh

  powershell:
    name: powershell · windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional

      # Until this job existed, the two PowerShell scripts had been
      # written and reviewed but never executed — there is no PowerShell
      # in the environment they were written in. Reading them found two
      # real bugs, which is a poor argument that there are no more.
      - name: parse the scripts
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' }
          if ($files.Count -lt 6) {
            Write-Host "::error::expected at least 6 .ps1 files, found $($files.Count)"
            exit 1
          }
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error file=$($f.Name)::$($errors.Count) parse error(s)"
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            } else { Write-Host "ok  $($f.Name)" }
          }
          if ($failed) { exit 1 }

      # Parsing proves it is valid PowerShell. This proves it works:
      # a real transcript in, a real capture out.
      - name: mem-capture.ps1 actually captures
        shell: pwsh
        run: |
          $mem = Join-Path $PWD 'bin/mem'
          $memdir = Join-Path ([System.IO.Path]::GetTempPath()) ("cm-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $memdir | Out-Null
          node $mem --root $memdir init | Out-Null

          # A transcript big enough to pass the capture threshold.
          $lines = 1..400 | ForEach-Object {
            @{ timestamp = '2026-01-01T00:00:00Z'
               message = @{ content = "line $_ about deployment and errors" } } | ConvertTo-Json -Compress
          }
          $transcript = Join-Path $memdir 'transcript.jsonl'
          Set-Content -Path $transcript -Value $lines

          $env:CHEAP_MEM_ROOT = $memdir
          $env:CLAUDE_TRANSCRIPT_PATH = $transcript
          # Pipe a payload in rather than inheriting the runner's stdin:
          # the hook reads stdin to the end when it is redirected, and an
          # inherited handle that never closes hangs the job.
          '{}' | & pwsh -NoProfile -File bin/mem-capture.ps1

          $captured = Get-ChildItem -Path (Join-Path $memdir 'raw') -Recurse -Filter *.jsonl.gz -ErrorAction SilentlyContinue
          if (-not $captured) {
            Write-Host "::error::mem-capture.ps1 produced no capture"
            exit 1
          }
          Write-Host "captured $($captured.Count) file(s)"

          # And the redaction has to work on this path too.
          Add-Content -Path $transcript -Value (
            @{ message = @{ content = ("export GITHUB_TOKEN=ghp_" + ('K' * 36)) } } | ConvertTo-Json -Compress)
          Add-Content -Path $transcript -Value ($lines[0..200])
          '{}' | & pwsh -NoProfile -File bin/mem-capture.ps1

          # Two captures, two files. They may well land in the same
          # second, which is exactly the case that used to overwrite the
          # first one and lose everything in it.
          $after = Get-ChildItem -Path (Join-Path $memdir 'raw') -Recurse -Filter *.jsonl.gz
          if ($after.Count -lt 2) {
            Write-Host "::error::second capture did not produce its own file ($($after.Count) total)"
            exit 1
          }

          $found = node $mem --root $memdir raw check
          Write-Host $found
          if ($found -notmatch 'Nothing found') {
            Write-Host "::error::a secret survived capture on Windows"
            exit 1
          }

      # **What this step used to prove, and why that was nothing.**
      #
      # It created an empty root, ran the tick, and checked
      # `$LASTEXITCODE -ne 0`. But `exit 0` is what mem-digest.ps1
      # returns for "not due" AND for a digest that ran to completion.
      # One code, two outcomes — the check cannot separate them. No fake
      # model was planted and no call was counted, so a tick that fired
      # a model on an empty pile passed this step. That is the one
      # promise the step claims to keep.
      #
      # Fixed here by measuring the two things that actually differ: the
      # dueness answer BEFORE the run, and whether a model was started.
      - name: mem-digest.ps1 starts no model when nothing is due
        shell: pwsh
        run: |
          $memdir = Join-Path ([System.IO.Path]::GetTempPath()) ("cm-d-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $memdir | Out-Null
          node (Join-Path $PWD 'bin/mem') --root $memdir init | Out-Null
          $tally = Join-Path $memdir 'calls.txt'
          # A fake model that leaves a mark. Start-Process needs something
          # Windows can start, so a .cmd, not a shell script.
          $fake = Join-Path $memdir 'fake-model.cmd'
          Set-Content -Path $fake -Value "@echo x >> `"$tally`"`r`n@exit /b 0"
          $env:CHEAP_MEM_ROOT = $memdir
          $env:MEM_DIGEST_CMD = $fake

          # Establish the precondition, then MEASURE it. `mem digest due`
          # exits 0 = no, 1 = yes, 3 = cannot tell. Anything but 0 here
          # means this step is not measuring what its name says.
          node (Join-Path $PWD 'bin/mem') --root $memdir digest due
          $due = $LASTEXITCODE
          if ($due -ne 0) {
            Write-Host "::error::precondition does not hold — something is due (exit $due)"
            exit 1
          }

          '{}' | & pwsh -NoProfile -File bin/mem-digest.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::digest tick exited $LASTEXITCODE with nothing to do"
            exit 1
          }
          if (Test-Path $tally) {
            Write-Host "::error::the tick started a model although nothing was due"
            exit 1
          }
          Write-Host "nothing due, no model call"

      # The other half, and the one that was missing entirely: with work
      # due, EXACTLY ONE call. Without it, a tick that never starts a
      # model passes the step above and nothing notices.
      #
      # Dueness is ESTABLISHED, not borrowed: the threshold comes from
      # MEM_DIGEST_VOLUME_NOW_KB, so the step does not depend on how much
      # raw material this checkout happens to carry. The sibling memory
      # had exactly that bug — the same unchanged step was red at 441 KB
      # and green at 780 KB, 45 minutes apart, with no code change.
      - name: mem-digest.ps1 makes exactly one model call when work is due
        shell: pwsh
        run: |
          $mem = Join-Path $PWD 'bin/mem'
          $memdir = Join-Path ([System.IO.Path]::GetTempPath()) ("cm-e-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $memdir | Out-Null
          node $mem --root $memdir init | Out-Null

          # Real material, the same way the capture step above makes it.
          $lines = 1..400 | ForEach-Object {
            @{ timestamp = '2026-01-01T00:00:00Z'
               message = @{ content = "line $_ about deployment and errors" } } | ConvertTo-Json -Compress
          }
          $transcript = Join-Path $memdir 'transcript.jsonl'
          Set-Content -Path $transcript -Value $lines
          $env:CHEAP_MEM_ROOT = $memdir
          $env:CLAUDE_TRANSCRIPT_PATH = $transcript
          '{}' | & pwsh -NoProfile -File bin/mem-capture.ps1
          Remove-Item Env:\CLAUDE_TRANSCRIPT_PATH

          $tally = Join-Path $memdir 'calls.txt'
          $fake = Join-Path $memdir 'fake-model.cmd'
          Set-Content -Path $fake -Value "@echo x >> `"$tally`"`r`n@exit /b 0"
          $env:MEM_DIGEST_CMD = $fake
          $env:MEM_DIGEST_VOLUME_NOW_KB = '1'

          node $mem --root $memdir digest due --volume-now 1
          $due = $LASTEXITCODE
          if ($due -ne 1) {
            Write-Host "::error::precondition does not hold — nothing is due (exit $due)"
            exit 1
          }

          '{}' | & pwsh -NoProfile -File bin/mem-digest.ps1
          $code = $LASTEXITCODE
          $calls = 0
          if (Test-Path $tally) { $calls = (Get-Content $tally | Measure-Object -Line).Lines }
          Write-Host "model calls: $calls, exit $code"
          if ($calls -ne 1) {
            Write-Host "::error::$calls model calls instead of exactly one"
            exit 1
          }
          # The fake model returns 0 without digesting anything. The tick
          # must notice that and say so — an exit code is not an effect.
          if ($code -ne 1) {
            Write-Host "::error::an ineffective run ended with $code instead of 1"
            exit 1
          }
          Write-Host "one call, and the ineffective run was caught"

  digest:
    name: digest · posix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      # **The POSIX digest had no CI at all until now.** Only
      # mem-digest.ps1 was exercised, and only in a way that could not
      # tell "did nothing" from "did everything" (see the powershell job).
      # bin/mem-digest is the script that actually runs on the machines
      # most people use, and nothing here had ever started it.
      #
      # Two halves, and each one ESTABLISHES its precondition and then
      # MEASURES it. `mem digest due` exits 0 = no, 1 = yes, 3 = cannot
      # tell. Note the `|| DUE=$?`: under `set -e` the SUCCESS case of
      # the second half (exit 1 = due) would otherwise kill the step.
      - name: bin/mem-digest starts no model when nothing is due
        run: |
          set -euo pipefail
          W="$(mktemp -d)"
          node bin/mem --root "$W" init > /dev/null
          TALLY="$W/calls"
          printf '#!/bin/sh\necho x >> "%s"\nexit 0\n' "$TALLY" > "$W/fake-model"
          chmod +x "$W/fake-model"

          DUE=0
          node bin/mem --root "$W" digest due || DUE=$?
          if [ "$DUE" -ne 0 ]; then
            echo "::error::precondition does not hold — something is due (exit $DUE)"; exit 1
          fi

          CODE=0
          env CHEAP_MEM_ROOT="$W" MEM_DIGEST_CMD="$W/fake-model" \
            MEM_DIGEST_LOG="$W/digest.log" bash bin/mem-digest < /dev/null || CODE=$?
          test "$CODE" -eq 0 || { echo "::error::the tick exited $CODE with nothing to do"; exit 1; }
          if [ -e "$TALLY" ]; then
            echo "::error::the tick started a model although nothing was due"; exit 1
          fi
          echo "nothing due, no model call"

      # **The lock, and the macOS hole it had (found by the step above,
      # on its first CI run).** `flock` does not exist on macOS, and the
      # script used to call it bare: a missing flock made the `if` true,
      # so every tick on every Mac said "already running, skipping" and
      # returned 0. The digest had NEVER run there, silently, and the
      # exit code said everything was fine.
      #
      # The repair is a `mkdir` fallback. A repair without a probe is a
      # hope, so this step measures the thing the lock is FOR: two ticks
      # at once, exactly one model call. It runs on both platforms, so
      # the flock path and the mkdir path are each covered by whichever
      # runner has them.
      - name: two ticks at once make one model call, not two
        run: |
          set -euo pipefail
          W="$(mktemp -d)"
          node bin/mem --root "$W" init > /dev/null
          L="$W/transcript.jsonl"; : > "$L"
          i=0
          while [ "$i" -lt 400 ]; do
            printf '{"timestamp":"2026-01-01T00:00:00Z","message":{"content":"line %s about deployment and errors"}}\n' \
              "$i" >> "$L"
            i=$((i+1))
          done
          env CHEAP_MEM_ROOT="$W" CLAUDE_TRANSCRIPT_PATH="$L" \
            bash bin/mem-capture < /dev/null > /dev/null 2>&1 || true

          # Same rule as the two steps around it: establish dueness, then
          # MEASURE it. Without this, a root where nothing is due would
          # give two ticks, zero calls — and the count below would fail
          # pointing at the lock, which had nothing to do with it.
          DUE=0
          node bin/mem --root "$W" digest due --volume-now 1 || DUE=$?
          if [ "$DUE" -ne 1 ]; then
            echo "::error::precondition does not hold — nothing is due (exit $DUE)"; exit 1
          fi

          # The fake model dawdles, so the two ticks really overlap.
          TALLY="$W/calls"
          printf '#!/bin/sh\nsleep 3\necho x >> "%s"\nexit 0\n' "$TALLY" > "$W/fake-model"
          chmod +x "$W/fake-model"

          for n in 1 2; do
            env CHEAP_MEM_ROOT="$W" MEM_DIGEST_CMD="$W/fake-model" \
              MEM_DIGEST_LOG="$W/log$n" MEM_DIGEST_VOLUME_NOW_KB=1 \
              bash bin/mem-digest < /dev/null > /dev/null 2>&1 &
          done
          wait

          CALLS=0
          [ -e "$TALLY" ] && CALLS="$(wc -l < "$TALLY" | tr -d ' ')"
          echo "model calls from two concurrent ticks: $CALLS"
          test "$CALLS" -eq 1 || { echo "::error::$CALLS model calls — the lock does not hold"; exit 1; }
          # And the loser must SAY it stood down. A tick that dies quietly
          # counts as one call too, and would pass the line above.
          grep -q "already running" "$W"/log1 "$W"/log2 || {
            echo "::error::neither tick reported standing down — the lock may not be why"; exit 1; }
          echo "one call, and the other tick stood down"

      # Dueness is ESTABLISHED through the threshold, not borrowed from
      # whatever this checkout happens to carry. The sibling memory had
      # exactly that bug: the same unchanged step was red at 441 KB and
      # green at 780 KB, 45 minutes apart, with no code change. A red
      # that goes away by itself teaches people to stop reading red.
      - name: bin/mem-digest makes exactly one model call when work is due
        run: |
          set -euo pipefail
          W="$(mktemp -d)"
          node bin/mem --root "$W" init > /dev/null

          # Real material, made the way the capture hook makes it.
          L="$W/transcript.jsonl"; : > "$L"
          i=0
          while [ "$i" -lt 400 ]; do
            printf '{"timestamp":"2026-01-01T00:00:00Z","message":{"content":"line %s about deployment and errors"}}\n' \
              "$i" >> "$L"
            i=$((i+1))
          done
          env CHEAP_MEM_ROOT="$W" CLAUDE_TRANSCRIPT_PATH="$L" \
            bash bin/mem-capture < /dev/null > /dev/null 2>&1 || true
          FAENGE="$(find "$W/raw" -name '*.jsonl.gz' 2>/dev/null | wc -l | tr -d ' ')"
          test "$FAENGE" -ge 1 || { echo "::error::no capture was produced — nothing to digest"; exit 1; }

          TALLY="$W/calls"
          printf '#!/bin/sh\necho x >> "%s"\nexit 0\n' "$TALLY" > "$W/fake-model"
          chmod +x "$W/fake-model"

          DUE=0
          node bin/mem --root "$W" digest due --volume-now 1 || DUE=$?
          if [ "$DUE" -ne 1 ]; then
            echo "::error::precondition does not hold — nothing is due (exit $DUE)"; exit 1
          fi

          CODE=0
          env CHEAP_MEM_ROOT="$W" MEM_DIGEST_CMD="$W/fake-model" \
            MEM_DIGEST_LOG="$W/digest.log" MEM_DIGEST_VOLUME_NOW_KB=1 \
            bash bin/mem-digest < /dev/null || CODE=$?
          CALLS=0
          [ -e "$TALLY" ] && CALLS="$(wc -l < "$TALLY" | tr -d ' ')"
          echo "model calls: $CALLS, exit $CODE"
          test "$CALLS" -eq 1 || { echo "::error::$CALLS model calls instead of exactly one"; exit 1; }
          # The fake model returns 0 without digesting anything. The tick
          # must notice that — an exit code is not an effect.
          test "$CODE" -eq 1 || { echo "::error::an ineffective run ended with $CODE instead of 1"; exit 1; }
          echo "one call, and the ineffective run was caught"

  bench:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional

      # The README quotes numbers from this. Running it on every commit
      # is what keeps them from quietly becoming false.
      - name: token benchmark
        run: |
          set -euo pipefail
          npm run bench | tee bench.txt
          RECALL="$(grep -oE 'answer retrieved: +[0-9]+/[0-9]+' bench.txt | grep -oE '[0-9]+/[0-9]+')"
          GOT="${RECALL%%/*}"
          WANT="${RECALL##*/}"
          echo "recall: $GOT of $WANT"
          # A saving with a miss rate is not a saving. If retrieval drops
          # below 12 of 15, the numbers in the README stop being true.
          if [ "$GOT" -lt 12 ]; then
            echo "::error::retrieval fell to $GOT/$WANT — the README claim no longer holds"
            exit 1
          fi

  verify:
    name: guarantees
    runs-on: ubuntu-latest
    # Mutation runs the test suite once per mutant, plus a full-suite
    # re-check for each survivor. Slower than the rest of CI put together
    # and worth every second of it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional

      # Everything under `npm test` answers "do the tests pass". This job
      # answers the question that actually matters: are the guarantees
      # ENFORCED, or do they only exist in documentation?
      #
      # It exists because the answer had been "an audit round finds out,
      # eventually". Four rounds each ended with "nothing fundamental is
      # open"; three of those were wrong. The point of a gate is that the
      # fourth kind of finding arrives as a red build instead.
      #
      #   mutation           48 mutants: break one guarantee, expect a
      #                      test to notice. Skipped and ambiguous
      #                      anchors fail too — a mutant that never ran
      #                      used to be counted as caught.
      #   fuzz               no crash, hang, unbounded growth or bypass
      #   composed           7 attacks that are only dangerous combined
      #   byzantine          a flood of rule-abiding liars: the genuine
      #                      claim survives and the conflict is reported
      #   cache-attack       an unsigned local file cannot change meaning
      #   query-independence state(log) does not depend on the query
      #   merge-driver       the *.jsonl merge=union contract, with a
      #                      control case proving the driver does work
      # `npm run lint` existed from the first week and no job ever ran it.
      # On 2026-09-16 it was reporting three errors, one of them a call to
      # an undefined `fail()` inside the guard that refuses
      # `shrink --new-baseline` without a reason: the guard threw a
      # ReferenceError instead of saying what was missing. Nobody saw it,
      # because a check that reports into a channel nobody reads is the
      # same as no check. Runs BEFORE verify — it is seconds, verify is
      # twenty minutes, and there is no point mutating code that does not
      # parse cleanly.
      #
      # eslint exits non-zero on errors and zero on warnings, so this gate
      # is about defects, not about style debt. The seven warnings standing
      # today are deliberately not a build break.
      - name: lint
        run: npm run lint

      - name: the guarantees, enforced
        run: npm run verify

      # git config, not code: the mutation harness writes into src/ and
      # restores it. If a run ever leaves a mutant behind, the next job to
      # touch this tree inherits a silent bug.
      - name: no mutant left behind
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the verify run left the working tree dirty"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "working tree clean"
