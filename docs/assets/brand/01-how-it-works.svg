<text x="622" y="309" fill="#E8C586" font-family="DejaVu Sans Mono, sans-serif" font-size="20" font-weight="700">02</text>
<text x="622" y="369" fill="#F6F4EC" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700">Digest</text>
<text x="622" y="424" fill="#E8C586" font-family="DejaVu Sans Mono, sans-serif" font-size="17" font-weight="700">MODEL STEP</text>
<text x="622" y="483" fill="#AEC0B8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">Process accumulated records.</text>
<text x="622" y="517" fill="#AEC0B8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">Extract structured knowledge.</text>
