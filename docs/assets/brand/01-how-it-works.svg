<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">Store cheaply. Think in batches. Recall with code.</title><desc id="desc">The standard path keeps model work outside the interactive search loop.</desc>
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#101B1B" stroke="#101B1B"/>
<text x="72" y="65" fill="#54D6A0" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700">cheap-mem</text>
<text x="1240" y="65" fill="#AEC0B8" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="400">01 / HOW IT WORKS</text>
<text x="72" y="150" fill="#F6F4EC" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="700">Store cheaply. Think in batches. Recall with code.</text>
<text x="72" y="199" fill="#AEC0B8" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">The standard path keeps model work outside the interactive search loop.</text>
<rect x="72" y="262" width="412" height="355" rx="20" fill="#182928" stroke="#344D46"/>
<text x="100" y="309" fill="#54D6A0" font-family="DejaVu Sans Mono, sans-serif" font-size="20" font-weight="700">01</text>
<text x="100" y="369" fill="#F6F4EC" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700">Capture</text>
<text x="100" y="424" fill="#54D6A0" font-family="DejaVu Sans Mono, sans-serif" font-size="17" font-weight="700">NO MODEL</text>
<text x="100" y="483" fill="#AEC0B8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">Redact sensitive strings.</text>
<text x="100" y="517" fill="#AEC0B8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">Append the session record.</text>
